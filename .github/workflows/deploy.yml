name: backend-deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env: #IMAGE_NAME 예약어 X
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nqve-back #Registry/namespace/image 이름 , 주의점! 이건 경로가 아니라 논리적인 구분. linux 경로가 아니다.

jobs:
  build-and-push: #build-and-push 예약어 X
    runs-on: ubuntu-latest

    permissions: #GitHub 내부 API/리소스 접근 권한
      contents: read #repository 내용 읽기 가능, uses: actions/checkout@v4로 소스를 받아오잖아. 그러려면 repository contents를 읽을 권한이 필요함. (소스 읽어)
      packages: write #GitHub Packages에 쓰기 가능, GHCR이 GitHub Packages 계열이라서 나중에 docker push ghcr.io/...로 Docker 이미지를 올리려면 이 권한이 필요함. (GHCR에 이미지 올려)
      actions: read #GitHub Actions 관련 리소스/정보를 읽을 수 있음. 그냥 이건 대충 Github Actions 정보 읽어야 된다라고 이해하셈. (Github actions 정보 읽어) *필요 없단다

    steps:
    - name: Checkout source #예약어 X
      uses: actions/checkout@v4 #actions의 checkout이고 v4 사용한다는 뜻
      #하는 이유 : runner에 checkout한 소스가 없으니까

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    #하는 이유 : JDK가 없어서 build 못하니까

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    #하는 이유 : gradlew 권한 없어서 명령어 실행 못하니까
    - name: Build with Gradle
      run: ./gradlew build -x test
    #하는 이유 : gradlew build 해서 .jar 만들기
    - name: Log in to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    #하는 이유 : GHCR에 IMAGE push 하기위해. github event가 push 이고, main 브랜치인 상태에서 docker ghcr 로 로그인하는 것. --password-stdin 을 따로 token으로 받아서 로그인.
    - name: Build Docker Image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: | 
       docker build \
        -t ${{ env.IMAGE_NAME }}:latest \
        -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
        .
    #하는 이유 : build 해서 image 만드는 과정임. 태그를 latest 랑 github.sha로 달아서 관리하기 편하게 함. 항상 최신 image도 쌓고 sha 기준 image도 쌓아놓음.
    #주의점 : 해당 build는 runner 로컬에서 실행해서 image를 만들고 그 이후에 ghcr로 push 한다.
    - name: Push Docker Image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker push ${{ env.IMAGE_NAME }}:latest
        docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
      #하는 이유 : image를 ghcr로 push 하는 것.
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    #if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    if: false

    steps:
    - name: Deploy to Linux desktop
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          cd ${{ secrets.BACKEND_DEPLOY_DIR }}
          git pull
          docker login ghcr.io -u ${{ github.repository_owner }} -p ${{ secrets.GHCR_PAT }}
          docker pull ${{ env.IMAGE_NAME }}:latest
          BACKEND_IMAGE=${{ env.IMAGE_NAME }}:latest docker compose up -d db
          BACKEND_IMAGE=${{ env.IMAGE_NAME }}:latest docker compose up -d --no-build app
